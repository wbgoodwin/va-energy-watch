name: Nightly rebuild

# Rebuilds the site every morning so "today", comment-deadline countdowns and
# "coming up" lists stay current. It does NOT crawl the SCC website: the SCC's
# robots.txt disallows automated access, so cases are entered by hand.
# See docs/dockets.md.

on:
  schedule:
    - cron: "15 10 * * *" # 5:15 AM Eastern (6:15 AM during daylight time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping deploy. See docs/deploy.md."
            exit 0
          fi
          npx wrangler deploy
